<div class="pantallaCompleta">
        <aside class="barraLateral">
            <a href="index.html">
                <img src="/images/logo2.png" class="logoPequeMenu" alt="logoInicio">
            </a>
          <div class="menu">
          <button (click)="cambiarSeccion('pacientes')" [class.activo]="seccionActiva === 'pacientes'">MODULO PACIENTES</button>
          </div>
        </aside>

        <main class="areaPrincipal">
            <div id="inicio" class="seccion-contenido activa" [class.activa]="seccionActiva === 'inicio'">
                <div class="grupoBotonesLoginAgenda">
                    <button class="btnLoginAgenda" (click)="cambiarSeccion('agendador')">
                    <i class="iconoUsuario"></i> Iniciar sesión
                </button>
                <button class="btnLoginAgenda" (click)="cambiarSeccion('pacientes')">
                    <i class="iconoUsuario"></i> Agenda tu cita
                </button>
                </div>
                <app-carrusel></app-carrusel>
            </div>

            <div id="pacientes" class="seccion-contenido"  [class.activa]="seccionActiva === 'pacientes'">
                <div class="informacion">
                    <h1>MODULO PARA PACIENTES</h1>
                    <p>Sección para pacientes, separa tus citas médicas en minutos</p>
                </div>
                <app-paciente-form></app-paciente-form>
            </div>

            <div id="agendador" class="seccion-contenido" [class.activa]="seccionActiva === 'agendador'">
                <div class="informacion">
                    <h1>MODULO PARA PERSONAL CLINICO</h1>
                    <p>Sección para agendadores y administradores</p>
                </div>
                <app-login-form tipoUsuario="agendador"></app-login-form>
            </div>
        <app-footer></app-footer>
        </main>
    </div>
