<div class="login">
    <h2 class="titulo-login">Acceso al sistema</h2>
    <p class="subtitulo-login">Ingresa tus credenciales</p>

    <form class="formulario-login" [formGroup]="form" (ngSubmit)="submit()">
        <div class="grupo-input">
            <label for="login">Usuario</label>
            <input type="text" id="login" formControlName="login" autocomplete="username" />
            <span class="error-campo" *ngIf="form.get('login')?.invalid && form.get('login')?.touched">
                El usuario es obligatorio
            </span>
        </div>

        <div class="grupo-input">
            <label for="password">Contraseña</label>
            <input type="password" id="password" formControlName="password" autocomplete="current-password" />
            <span class="error-campo" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
                La contraseña es obligatoria
            </span>
        </div>

        <p class="error-general" *ngIf="errorMensaje()">{{ errorMensaje() }}</p>

        <button type="submit" class="btn-ingresar" [disabled]="cargando()">
            {{ cargando() ? 'Ingresando…' : 'Iniciar sesión' }}
        </button>
    </form>

    <p class="enlace-registro">
        ¿Aún no tienes cuenta? <a routerLink="/registro">Regístrate como paciente</a>
    </p>
</div>
