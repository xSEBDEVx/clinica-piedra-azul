<div class="login">
    <h2 class="titulo-login">Acceso al Sistema</h2>
    <p class="subtitulo-login">Ingresa tus credenciales de {{ tipoUsuario }}</p>
    
    <form class="formulario-login">
        <div class="grupo-input">
            <label>Correo electrónico o Usuario</label>
            <!-- Usamos llaves para inyectar el tipo en el ID y que sean únicos -->
            <input type="text" id="usuario-{{ tipoUsuario }}" required>
        </div>
        <div class="grupo-input">
            <label>Contraseña</label>
            <input type="password" id="password-{{ tipoUsuario }}" required>
        </div>
        <button type="submit" class="btn-ingresar">Iniciar Sesión</button>
    </form>
</div>
